<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>nearU · Product page (spoon rest)</title>
<link rel="stylesheet" href="nu.css">
<style>.hero { position: relative; height: 393px; flex: none; background: #3a332c center / cover; } .hero .st { color: #fff; }
.rb { position: absolute; top: 47px; width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,.35); color: #fff; display: grid; place-items: center; } .rb svg { width: 22px; height: 22px; } .rb.l { left: 14px; } .rb.r { right: 14px; } .rb.heart[aria-pressed="true"] svg { fill: #fff; }
.dots { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; gap: 3px; padding: 3px 5px; border-radius: 6px; background: rgba(255,255,255,.7); } .dots i { width: 5px; height: 5px; border-radius: 3px; background: #c9c9c9; } .dots i.on { width: 12px; background: var(--ink); }
.pb { padding: 0; } .gray { background: var(--field); padding: 20px 16px; } .price { font-size: 22px; font-weight: 600; } .d { color: var(--gray); font-size: 15px; margin: 4px 0 20px; } .pb .li { margin: 0 16px; border-bottom: 1px solid #f2f2f2; }</style></head>
<body><div class="screen on-photo" aria-label="Product page (spoon rest)">
<div class="hero" style="background-image:url(assets/hero-spoon.webp)"><div data-render="status"></div><button class="rb l" data-go="home" aria-label="Back"><i data-icon="back"></i></button>
<button class="rb r heart" data-toggle aria-pressed="false" aria-label="Save"><i data-icon="heart"></i></button><span class="dots"><i></i><i></i><i class="on"></i><i></i></span></div>
<div class="body pb"><div class="gray"><p class="price">$15.99</p><p class="d">Silicone and acacia wood spoon rest.</p><button class="btn" data-go="bag">Add to bag <i data-icon="bagbtn"></i></button></div>
<a class="li" data-go="product-info"><span class="sp">Product information</span><i data-icon="chev" class="chev"></i></a>
<a class="li" data-go="reviews"><span class="sp">Reviews</span><span class="v">32</span></a></div>
</div><script src="nu.js"></script><script src="proto.js"></script>
</body></html>
