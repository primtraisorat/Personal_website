<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>nearU · Rate your trade</title>
<link rel="stylesheet" href="nu.css">
<style>.who { display: flex; gap: 12px; align-items: center; margin-top: 4px; } .who .av { width: 44px; height: 44px; } .who b { font-weight: 500; font-size: 15px; display: block; } .who small { color: var(--muted); font-size: 12px; }
.q { margin: 22px 0 12px; text-align: center; } .rate { display: flex; justify-content: center; gap: 10px; } .rate svg { width: 34px; height: 34px; fill: none; stroke: #c9c9c9; stroke-width: 1.4; stroke-linejoin: round; } .rate .on svg { fill: #f6c51a; stroke: #f6c51a; }
.w { text-align: center; color: var(--gray); margin: 8px 0 6px; font-size: 15px; } .lb { font-size: 13px; color: var(--gray); margin: 16px 0 8px; } .rv { margin: 18px 0 16px; }</style></head>
<body><div class="screen " aria-label="Rate your trade">
<div data-render="status"></div><header data-render="bar:Rate your trade:close:home::"></header><div class="body"><div class="who"><span class="av" id="av"></span><span class="sp"><b id="sn"></b><small id="ti"></small></span></div>
<h2 class="h2 q" id="q">how was trading with Erin?</h2><div class="rate" id="rate"><button data-v="1" aria-label="1 stars"><svg viewBox="0 0 24 24"><path d="m12 3.5 2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.8l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/></svg></button><button data-v="2" aria-label="2 stars"><svg viewBox="0 0 24 24"><path d="m12 3.5 2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.8l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/></svg></button><button data-v="3" aria-label="3 stars"><svg viewBox="0 0 24 24"><path d="m12 3.5 2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.8l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/></svg></button><button data-v="4" aria-label="4 stars"><svg viewBox="0 0 24 24"><path d="m12 3.5 2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.8l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/></svg></button><button data-v="5" aria-label="5 stars"><svg viewBox="0 0 24 24"><path d="m12 3.5 2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.8l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/></svg></button></div><p class="w" id="w">Perfect</p>
<p class="lb">what went well?</p><div class="chips" id="tg"><button data-toggle aria-pressed="true">On time</button><button data-toggle aria-pressed="true">As described</button><button data-toggle aria-pressed="false">Friendly</button><button data-toggle aria-pressed="false">Fair price</button><button data-toggle aria-pressed="false">Easy to message</button></div>
<div class="fields rv"><div class="fld"><label>Short review</label><input id="txt" type="text" value="Quick and easy pick-up, exactly as described" aria-label="Short review"></div></div><button class="btn" id="send">Submit review</button></div>
</div><script src="data.js"></script><script src="nu.js"></script><script>var it=NU.item(decodeURIComponent(location.hash.slice(1))||NU.get("item"));NU.set("item",it.id);document.getElementById("av").style.backgroundImage="url(assets/"+it.av+".webp)";document.getElementById("sn").textContent=it.seller;document.getElementById("ti").textContent=(NU.rent(it)?"Rented ":"Bought ")+it.title;
document.getElementById("q").textContent="how was trading with "+it.first+"?";
var W=["Bad","Not great","Okay","Good","Perfect"],v=5,b=document.querySelectorAll("#rate button");function set(n){v=n;b.forEach(function(x){x.classList.toggle("on",+x.dataset.v<=n);});document.getElementById("w").textContent=W[n-1];}set(5);
b.forEach(function(x){x.addEventListener("click",function(){set(+x.dataset.v);});});
document.getElementById("send").addEventListener("click",function(){var C=NU.chat(it.id),m=NU.me();NU.set("prevMe",JSON.stringify(m));
 if(C.stage<4){C.stage=4;C.msgs.push(["sys","You rated "+it.first+" "+"★".repeat(v)]);C.msgs.push(["them","Thanks! Rated you 5 stars too 🙌"]);NU.chat(it.id,C);
  m.score=(m.score*m.ratings+5)/(m.ratings+1);m.ratings++;m.trades++;m.verified=true;NU.me(m);}
 NU.set("lastRated",it.id);NU.go("trust");});</script><script src="proto.js"></script>
</body></html>
