<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>nearU · Product information</title>
<link rel="stylesheet" href="nu.css">
<style>.x svg { width: 24px; height: 24px; } .big { margin-top: 10px; } .s { margin: 20px 0 4px; } .li { font-size: 14px; min-height: 46px; } .li .v { font-size: 14px; }</style></head>
<body><div class="screen ov" aria-label="Product information">
<div class="sheet"><div class="grab"></div><button class="x" data-close aria-label="Close"><i data-icon="close"></i></button><h1 class="big">product information</h1>
<h2 class="h2 s">details</h2><div id="d1"></div><h2 class="h2 s">pick up</h2><div id="d2"></div></div>
</div><script src="data.js"></script><script src="nu.js"></script><script>var it=NU.item(NU.get("item")),c=NU.cat(it.cat);function rows(R){return R.map(function(r){return '<div class="li"><span class="sp">'+r[0]+'</span><span class="v">'+r[1]+'</span></div>';}).join("");}
document.getElementById("d1").innerHTML=rows([["Category",c.emoji+" "+c.label],["Condition",it.cond],["Price",NU.money(it)],["Posted",(it.n%5+1)+" days ago"]]);
document.getElementById("d2").innerHTML=rows([["Meet at",it.place],["Seller",it.seller],["Meet on campus","Yes"]]);</script><script src="proto.js"></script>
</body></html>
