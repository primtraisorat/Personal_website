<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>nearU · Catalog</title>
<link rel="stylesheet" href="nu.css">
<style>.duo { margin-bottom: 8px; } .cnt { font-size: 12px; color: var(--muted); margin-bottom: 14px; } .nf { padding-top: 40px; }</style></head>
<body><div class="screen " aria-label="Catalog">
<div data-render="status"></div><header data-render="bar:Furniture:back:home::"></header><div class="body"><label class="search" data-go="search"><i data-icon="search"></i><span>Search</span></label><div class="duo"><button data-overlay="sort">Sort <i data-icon="sort"></i></button><button data-go="filter">Filter <i data-icon="filter"></i></button></div>
<p class="cnt" id="cnt"></p><div class="grid" id="grid"></div><div class="empty nf" id="nf" hidden><i data-guy="puzzled"></i><h2>nothing in this<br>price range</h2><p>try a wider range in Filter</p></div></div><nav data-render="tabs:home"></nav>
</div><script src="data.js"></script><script src="nu.js"></script><script>var k=decodeURIComponent(location.hash.slice(1))||NU.get("cat")||"furniture",c=NU.cat(k);NU.set("cat",c.key);document.querySelector(".bar h1").textContent=c.label;
function draw(){var lo=+(NU.get("lo")||0),hi=+(NU.get("hi")||1e9),so=+(NU.get("sort")||0);
 var L=NU.items.filter(function(i){return i.cat===c.key&&i.price>=lo&&i.price<=hi;});
 if(so===1)L.sort(function(a,b){return (b.tag==="new")-(a.tag==="new");});else if(so===2)L.sort(function(a,b){return a.price-b.price;});else if(so===3)L.sort(function(a,b){return b.price-a.price;});
 document.getElementById("grid").innerHTML=L.map(NU.tile).join("");document.getElementById("cnt").textContent=L.length+(L.length===1?" listing":" listings")+" near campus";document.getElementById("nf").hidden=!!L.length;}
draw();NU.onStore(function(k){if(k==="sort"||k==="lo"||k==="hi"||k==="saved")draw();});</script><script src="proto.js"></script>
</body></html>
