<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>nearU · Filter · Category</title>
<link rel="stylesheet" href="nu.css">
<style>.cl .li { width: 100%; text-align: left; } .cl .li .sp { font-size: 15px; } .cl .e { width: 24px; font-size: 19px; text-align: center; font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }</style></head>
<body><div class="screen " aria-label="Filter · Category">
<div data-render="status"></div><header data-render="bar:Category:back:filter::"></header><div class="body"><div class="cl" data-tabs id="cl"></div></div>
</div><script src="data.js"></script><script src="nu.js"></script><script>var cur=NU.get("cat")||"furniture",L=document.getElementById("cl");L.innerHTML=NU.cats.map(function(c){return '<button class="li" data-tab data-c="'+c.key+'" aria-selected="'+(c.key===cur)+'"><span class="e" aria-hidden="true">'+c.emoji+'</span><span class="sp">'+c.label+'</span><span class="radio">'+NU.icon("check")+'</span></button>';}).join("");
L.addEventListener("tab",function(e){NU.set("cat",e.detail.dataset.c);setTimeout(function(){NU.go("filter");},250);});</script><script src="proto.js"></script>
</body></html>
