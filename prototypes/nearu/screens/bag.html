<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>nearU · Bag</title>
<link rel="stylesheet" href="nu.css">
<style>.t { padding: 36px 0 22px; } .pc { margin: 14px 0 24px; } .pc input { text-transform: uppercase; } .pc button svg { width: 22px; height: 22px; color: var(--ink); }
.tot { display: flex; justify-content: space-between; } .tot b { font-size: 22px; font-weight: 600; } .tot.s { color: var(--muted); font-size: 15px; margin: 2px 0 24px; }</style></head>
<body><div class="screen " aria-label="Bag">
<div data-render="status"></div><div class="snack" hidden id="snack"><i data-icon="spin"></i><span class="sp">Item removed</span><button id="undo">Cancel</button></div>
<div class="body"><h1 class="big t">bag</h1><div id="items"><div class="bi" data-p="150.00"><div class="im" style="background-image:url(assets/p-bedside.webp)" data-go="product"></div><div><b>$150.00</b><p>Wooden bedside table featuring a raised design</p><span class="qty"><button aria-label="One fewer"><i data-icon="minus"></i></button><output>1</output><button aria-label="One more"><i data-icon="plus"></i></button></span></div><button class="x" aria-label="Remove"><i data-icon="x"></i></button></div><div class="bi" data-p="280.50"><div class="im" style="background-image:url(assets/p-glass.webp)" data-go="product"></div><div><b>$280.50</b><p>Square bedside table with legs, a rattan shelf and a…</p><span class="qty"><button aria-label="One fewer"><i data-icon="minus"></i></button><output>2</output><button aria-label="One more"><i data-icon="plus"></i></button></span></div><button class="x" aria-label="Remove"><i data-icon="x"></i></button></div></div><h2 class="h2">promocode</h2><div class="search pc"><input value="NEARU" aria-label="Promocode" id="pc"><button id="pcx" aria-label="Clear promocode"><i data-icon="x"></i></button></div>
<div class="tot"><b>total</b><b id="tot">$686.00</b></div><div class="tot s"><span>Promocode</span><span id="disc">-$25.00</span></div>
<button class="btn" data-go="contact">Checkout</button></div><nav data-render="tabs:bag"></nav>
</div><script src="nu.js"></script><script>NU.set("bagEmpty","");var undo=null,tm;function tot(){var t=0;document.querySelectorAll(".bi").forEach(function(r){t+=+r.dataset.p*+r.querySelector("output").value;});var d=document.getElementById("pc").value.trim().toUpperCase()==="NEARU"?25:0;
 document.getElementById("disc").textContent=d?"-$25.00":"$0.00";document.getElementById("tot").textContent="$"+(t-d).toFixed(2);}
document.querySelectorAll(".bi").forEach(function(r){var o=r.querySelector("output"),b=r.querySelectorAll(".qty button");
 b[0].addEventListener("click",function(){o.value=Math.max(0,+o.value-1);tot();});b[1].addEventListener("click",function(){o.value=+o.value+1;tot();});
 r.querySelector(".x").addEventListener("click",function(){var nx=r.nextSibling;r.remove();tot();undo=[r,nx];var s=document.getElementById("snack");s.hidden=false;clearTimeout(tm);
  tm=setTimeout(function(){s.hidden=true;undo=null;if(!document.querySelector(".bi")){NU.set("bagEmpty","1");NU.go("bag-empty");}},2500);});});
document.getElementById("undo").addEventListener("click",function(){if(undo){document.getElementById("items").insertBefore(undo[0],undo[1]&&undo[1].parentNode?undo[1]:null);undo=null;tot();}document.getElementById("snack").hidden=true;clearTimeout(tm);});
document.getElementById("pc").addEventListener("input",tot);document.getElementById("pcx").addEventListener("click",function(){document.getElementById("pc").value="";tot();});tot();</script><script src="proto.js"></script>
</body></html>
