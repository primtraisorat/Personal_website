<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>nearU · New review</title>
<link rel="stylesheet" href="nu.css">
<style>.rate { display: flex; justify-content: center; gap: 10px; margin-top: 18px; } .rate svg { width: 30px; height: 30px; fill: none; stroke: #c9c9c9; stroke-width: 1.4; stroke-linejoin: round; } .rate .on svg { fill: #f6c51a; stroke: #f6c51a; }
.w { text-align: center; color: var(--gray); margin: 8px 0 22px; font-size: 15px; } .ups { display: flex; gap: 10px; margin: 20px 0 28px; } .cam, .up { width: 56px; height: 56px; border-radius: 3px; background: var(--field) center / cover; display: grid; place-items: center; position: relative; cursor: pointer; }
.cam svg { width: 22px; height: 22px; } .up button { position: absolute; top: 3px; right: 3px; width: 14px; height: 14px; border-radius: 2px; background: rgba(255,255,255,.85); font-size: 9px; line-height: 14px; text-align: center; }</style></head>
<body><div class="screen " aria-label="New review">
<div data-render="status"></div><header data-render="bar:New review:close:reviews::"></header><div class="body"><div class="rate" id="rate"><button data-v="1" aria-label="1 stars"><svg viewBox="0 0 24 24"><path d="m12 3.5 2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.8l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/></svg></button><button data-v="2" aria-label="2 stars"><svg viewBox="0 0 24 24"><path d="m12 3.5 2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.8l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/></svg></button><button data-v="3" aria-label="3 stars"><svg viewBox="0 0 24 24"><path d="m12 3.5 2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.8l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/></svg></button><button data-v="4" aria-label="4 stars"><svg viewBox="0 0 24 24"><path d="m12 3.5 2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.8l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/></svg></button><button data-v="5" aria-label="5 stars"><svg viewBox="0 0 24 24"><path d="m12 3.5 2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.8l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/></svg></button></div><p class="w" id="w">Nice</p>
<div class="fld"><label>Your review</label><input id="txt" type="text" value="Everything is good. Nice quality" aria-label="Your review"></div>
<div class="ups"><label class="cam"><i data-icon="camera"></i><input type="file" accept="image/*" hidden></label><span class="up" style="background-image:url(assets/rev-1.webp)"><button aria-label="Remove photo">✕</button></span><span class="up" style="background-image:url(assets/rev-2.webp)"><button aria-label="Remove photo">✕</button></span></div>
<button class="btn" id="send">Send review</button></div>
</div><script src="nu.js"></script><script>var W=["Bad","Not great","Okay","Nice","Perfect"],v=4,b=document.querySelectorAll("#rate button");function set(n){v=n;b.forEach(function(x){x.classList.toggle("on",+x.dataset.v<=n);});document.getElementById("w").textContent=W[n-1];}set(4);
b.forEach(function(x){x.addEventListener("click",function(){set(+x.dataset.v);});});
document.querySelectorAll(".up button").forEach(function(x){x.addEventListener("click",function(){x.parentNode.remove();});});
document.querySelector(".cam input").addEventListener("change",function(){var f=this.files[0];if(!f)return;var s=document.createElement("span");s.className="up";s.style.backgroundImage="url("+URL.createObjectURL(f)+")";this.closest(".ups").appendChild(s);});
document.getElementById("send").addEventListener("click",function(){NU.set("review",document.getElementById("txt").value);NU.set("reviewStars",v);NU.go("reviews");});</script><script src="proto.js"></script>
</body></html>
