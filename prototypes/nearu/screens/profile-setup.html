<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>nearU · Set up your profile</title>
<link rel="stylesheet" href="nu.css">
<style>.up { display: grid; justify-items: center; gap: 12px; font-size: 13px; font-weight: 500; margin: 6px 0 22px; } .cam { width: 48px; height: 48px; border-radius: 50%; background: var(--field) center / cover; display: grid; place-items: center; } .cam svg { width: 22px; height: 22px; } .done { margin-top: 18px; }</style></head>
<body><div class="screen " aria-label="Set up your profile">
<div data-render="status"></div><header data-render="bar:Set up your profile:none::Skip:account"></header><div class="body"><a class="up" data-go="gallery"><span class="cam" id="pic"><i data-icon="camera"></i></span>Upload photo</a>
<div class="fields"><div class="fld"><label>Full name</label><input id="nm" type="text" value="Tanya Morenko" aria-label="Full name"></div><div class="fld"><label>Phone</label><input type="tel" value="+1 310 323-3212" aria-label="Phone"></div><div class="fld ph"><label>Email</label><input type="email" placeholder="Email" aria-label="Email" value=""></div><div class="fld ph"><label>Date of birth</label><input type="text" placeholder="Date of birth" aria-label="Date of birth" value=""></div></div><button class="btn done" data-go="account">Done</button></div><div data-render="kbd" id="kb"></div>
</div><script src="nu.js"></script><script>NU.set("signedOut","");NU.set("registered","1");var p=NU.get("photo");if(p){var c=document.getElementById("pic");c.style.backgroundImage="url(assets/"+p+".webp)";c.innerHTML="";}document.addEventListener("nukey",function(e){if(e.detail==="enter"){e.preventDefault();NU.go("account");}});var n=document.getElementById("nm");n.focus();n.setSelectionRange(99,99);</script><script src="proto.js"></script>
</body></html>
