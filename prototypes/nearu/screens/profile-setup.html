<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>nearU · Set up your profile</title>
<link rel="stylesheet" href="nu.css">
<style>.up { display: grid; justify-items: center; gap: 10px; font-size: 13px; font-weight: 500; margin: 2px 0 18px; } .cam { width: 64px; height: 64px; background-color: var(--field); display: grid; place-items: center; } .cam svg { width: 24px; height: 24px; } .tn { margin-top: 16px; } .done { margin-top: 16px; }</style></head>
<body><div class="screen " aria-label="Set up your profile">
<div data-render="status"></div><header data-render="bar:Set up your profile:back:verify::"></header><div class="body"><a class="up" data-go="gallery"><span class="cam av" id="pic"><i data-icon="camera"></i></span>Add a photo</a>
<div class="fields"><div class="fld"><label>Full name</label><input id="nm" type="text" value="Tanya Morenko" aria-label="Full name"></div><div class="fld"><label>Location</label><input type="text" value="Westwood, Los Angeles" aria-label="Location"></div><div class="fld"><label>School</label><input id="sc" type="text" value="UCLA · verified with .edu" aria-label="School"></div></div>
<div class="note tn"><i data-icon="star"></i><span><b>Your trust score</b><br>Buyers and sellers rate each other after every trade. Your score and number of ratings show on your profile.</span></div>
<button class="btn done" id="done">Done</button></div>
</div><script src="data.js"></script><script src="nu.js"></script><script>var p=NU.get("photo");if(p){var c=document.getElementById("pic");c.style.backgroundImage="url(assets/"+p+".webp)";c.innerHTML="";}document.getElementById("sc").readOnly=true;document.getElementById("done").addEventListener("click",function(){NU.set("joined","1");NU.set("signedOut","");NU.go("home");});</script><script src="proto.js"></script>
</body></html>
