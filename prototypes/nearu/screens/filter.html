<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>nearU · Filter</title>
<link rel="stylesheet" href="nu.css">
<style>.range { display: flex; justify-content: space-between; font-size: 15px; font-weight: 500; margin-top: 8px; } .slider { position: relative; height: 30px; margin: 4px 0 18px; }
.slider::before { content: ""; position: absolute; left: 0; right: 0; top: 14px; height: 1px; background: #e0e0e0; } #fill { position: absolute; top: 14px; height: 1px; background: var(--yellow); }
.slider input { position: absolute; inset: 0; width: 100%; margin: 0; background: none; pointer-events: none; -webkit-appearance: none; appearance: none; }
.slider input::-webkit-slider-thumb { -webkit-appearance: none; pointer-events: auto; width: 28px; height: 14px; border-radius: 2px; background: var(--yellow); cursor: pointer; }
.slider input::-moz-range-thumb { pointer-events: auto; width: 28px; height: 14px; border: 0; border-radius: 2px; background: var(--yellow); cursor: pointer; } .li { font-size: 15px; } .li .v { font-size: 14px; }</style></head>
<body><div class="screen " aria-label="Filter">
<div data-render="status"></div><header data-render="bar:Filter:close:catalog:Clear:"></header><div class="body"><div class="range"><span id="lo">$0</span><span id="hi">$1,500+</span></div>
<div class="slider"><input type="range" min="0" max="1500" step="5" value="0" id="a" aria-label="Lowest price"><input type="range" min="0" max="1500" step="5" value="1500" id="b" aria-label="Highest price"><i id="fill"></i></div><a class="li" data-go="filter-category"><span class="sp">Category</span><span class="v" id="cv">Furniture</span></a><a class="li" ><span class="sp">Condition</span><span class="v">All</span></a><a class="li" ><span class="sp">Pick up</span><span class="v">Anywhere near campus</span></a><a class="li" ><span class="sp">Seller</span><span class="v">UCLA students</span></a></div>
<div class="foot"><button class="btn" id="show">Show items</button></div>
</div><script src="data.js"></script><script src="nu.js"></script><script>var c=NU.cat(NU.get("cat")||"furniture"),a=document.getElementById("a"),b=document.getElementById("b"),M=1500;document.getElementById("cv").textContent=c.label;a.value=NU.get("lo")||0;b.value=NU.get("hi")||M;
function n(){return NU.items.filter(function(i){return i.cat===c.key&&i.price>=+a.value&&(+b.value>=M||i.price<=+b.value);}).length;}
function u(){if(+a.value>+b.value-20)a.value=+b.value-20;document.getElementById("lo").textContent="$"+(+a.value).toLocaleString("en-US");document.getElementById("hi").textContent=+b.value>=M?"$1,500+":"$"+(+b.value).toLocaleString("en-US");var f=document.getElementById("fill");f.style.left=a.value/M*100+"%";f.style.right=(100-b.value/M*100)+"%";var k=n();document.getElementById("show").textContent="Show "+k+(k===1?" item":" items");}
a.addEventListener("input",u);b.addEventListener("input",u);u();document.querySelector(".bar .r").addEventListener("click",function(){a.value=0;b.value=M;u();});
document.getElementById("show").addEventListener("click",function(){NU.set("lo",+a.value||"");NU.set("hi",+b.value>=M?"":b.value);NU.go("catalog#"+c.key);});</script><script src="proto.js"></script>
</body></html>
