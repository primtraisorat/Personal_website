<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>nearU · Search</title>
<link rel="stylesheet" href="nu.css">
<style>.sb { margin-top: 0; } .sb button svg { width: 24px; height: 24px; color: var(--ink); } #list li { display: flex; align-items: center; gap: 14px; min-height: 55px; font-size: 15px; cursor: pointer; }
#list li svg { width: 22px; height: 22px; } #list li .sp { flex: 1; min-width: 0; } #list li small { display: block; font-size: 12px; color: var(--muted); } #list li .rm svg { color: var(--gray); } .nf { padding-top: 70px; } .nf[hidden] { display: none; }
#list .e { width: 22px; text-align: center; font-size: 19px; font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }</style></head>
<body><div class="screen " aria-label="Search">
<div data-render="status"></div><div class="body"><div class="search sb"><button data-go="home" aria-label="Back"><i data-icon="back"></i></button><input id="q" placeholder="" aria-label="Search" autocomplete="off"><button id="qx" aria-label="Clear"><i data-icon="mic"></i></button></div>
<ul id="list"></ul><div class="empty nf" id="nf" hidden><i data-guy="puzzled"></i><h2>nothing found, try<br>something else</h2></div></div><div data-render="kbd"></div>
</div><script src="data.js"></script><script src="nu.js"></script><script>var RECENT=["Mini fridge","Football tickets"];
var q=document.getElementById("q"),L=document.getElementById("list"),nf=document.getElementById("nf"),qx=document.getElementById("qx");
function esc(s){var d=document.createElement("i");d.textContent=s;return d.innerHTML;}
function draw(){var v=q.value.trim().toLowerCase();nf.hidden=true;qx.innerHTML=NU.icon(v?"x":"mic");
 if(!v){L.innerHTML=RECENT.map(function(r,i){return '<li data-q="'+r+'">'+NU.icon("clock")+'<span class="sp">'+r+'</span><button class="rm" data-i="'+i+'" aria-label="Remove">'+NU.icon("x")+'</button></li>';}).join("");return;}
 var w=v.replace(/s$/,""),cs=NU.cats.filter(function(c){return c.label.toLowerCase().indexOf(w)>=0;}),its=NU.items.filter(function(i){var c=NU.cat(i.cat);return (i.title+" "+c.label).toLowerCase().indexOf(w)>=0;}).slice(0,8);
 L.innerHTML=cs.map(function(c){return '<li data-to="catalog#'+c.key+'"><span class="e" aria-hidden="true">'+c.emoji+'</span><span class="sp">'+c.label+'<small>All listings</small></span></li>';}).join("")+
  its.map(function(i){var c=NU.cat(i.cat);return '<li data-to="product#'+i.id+'"><span class="e" aria-hidden="true">'+(i.photo?c.emoji:i.pic)+'</span><span class="sp">'+esc(i.title)+'<small>'+c.label+' · '+NU.money(i)+'</small></span></li>';}).join("");nf.hidden=!!(cs.length+its.length);}
L.addEventListener("click",function(e){var r=e.target.closest(".rm");if(r){e.stopPropagation();RECENT.splice(+r.dataset.i,1);draw();return;}var li=e.target.closest("li");if(!li)return;if(li.dataset.q){q.value=li.dataset.q;draw();q.focus();}else NU.go(li.dataset.to);},true);
qx.addEventListener("click",function(){q.value="";draw();q.focus();});q.addEventListener("input",draw);
q.addEventListener("keydown",function(e){if(e.key==="Enter"){var f=L.querySelector("li[data-to]");if(f)NU.go(f.dataset.to);}});
q.value=decodeURIComponent(location.hash.slice(1));draw();q.focus();</script><script src="proto.js"></script>
</body></html>
