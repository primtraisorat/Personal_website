<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>nearU · Enter code from SMS</title>
<link rel="stylesheet" href="nu.css">
<style>.code { display: flex; gap: 10px; margin: 26px 0 0; } .code span { width: 40px; height: 54px; border-radius: 4px; background: var(--field); display: grid; place-items: center; font-size: 20px; } .code span.cur { background: #fff; border: 1px solid #d9d9d9; } .code span.cur::after { content: "|"; color: var(--ink); animation: blink 1s steps(1) infinite; } @keyframes blink { 50% { opacity: 0; } } .nc { text-align: center; color: var(--gray); margin-top: 72px; font-size: 14px; }.sub { color: var(--muted); font-size: 14px; margin-top: 4px; }</style></head>
<body><div class="screen " aria-label="Enter code from SMS">
<div data-render="status"></div><header data-render="bar::back:phone:Help:"></header><div class="body"><h1 class="big">welcome!<br>enter code from sms</h1><p class="sub">We sent it to +1 310 323-3212</p><div class="code"><span></span><span></span><span></span><span></span><span></span></div><p class="nc" id="nc">New code 0:20</p></div><div data-render="num"></div>
</div><script src="nu.js"></script><script>var d=["2","4"],sp=document.querySelectorAll(".code span"),t=20;function draw(){sp.forEach(function(s,i){s.textContent=d[i]||"";s.className=i===d.length?"cur":"";});}draw();document.addEventListener("nukey",function(e){e.preventDefault();if(e.detail==="del")d.pop();else if(d.length<5)d.push(e.detail);draw();if(d.length===5)setTimeout(function(){NU.go("profile-setup");},350);});var iv=setInterval(function(){t--;document.getElementById("nc").textContent=t>0?"New code 0:"+(t<10?"0":"")+t:"Send a new code";if(t<=0)clearInterval(iv);},1000);</script><script src="proto.js"></script>
</body></html>
