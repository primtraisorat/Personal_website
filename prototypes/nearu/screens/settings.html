<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>nearU · Settings</title>

.tg[aria-pressed="true"] { background: var(--yellow); } .tg[aria-pressed="true"]::after { transform: translateX(20px); }</style></head>

</div><script src="data.js"></script><script src="nu.js"></script><script>if(NU.get("signedOut"))document.querySelector(".bar .l").setAttribute("data-go","account-empty");</script><script src="proto.js"></script>
