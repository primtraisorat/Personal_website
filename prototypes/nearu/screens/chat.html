<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>nearU · Chat</title>
<link rel="stylesheet" href="nu.css">
<style>.bar { border-bottom: 1px solid #f2f2f2; } .strip { flex: none; display: flex; gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid #f2f2f2; cursor: pointer; } .strip .pic { width: 44px; height: 44px; border-radius: 4px; flex: none; } .strip .pic .e { font-size: 24px; } .strip .sp { flex: 1; min-width: 0; font-size: 13px; } .strip .sp p { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .strip b { font-weight: 600; font-size: 14px; }
.msgs { flex: 1; overflow-y: auto; padding: 14px 16px 6px; display: flex; flex-direction: column; gap: 8px; scrollbar-width: none; }
.mb { max-width: 78%; padding: 9px 12px; border-radius: 14px; font-size: 14px; line-height: 1.4; } .mb.me { align-self: flex-end; background: var(--yellow); border-bottom-right-radius: 4px; } .mb.them { align-self: flex-start; background: var(--field); border-bottom-left-radius: 4px; }
.mb.offer { font-weight: 600; } .mb.offer small { display: block; font-weight: 400; font-size: 11px; opacity: .7; }
.sys { align-self: center; display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--gray); background: #fff; border: 1px solid #ececec; border-radius: 12px; padding: 5px 10px; text-align: center; } .sys svg { width: 14px; height: 14px; color: #2f7d35; flex: none; }
.typing { align-self: flex-start; background: var(--field); border-radius: 14px; padding: 10px 14px; display: flex; gap: 4px; } .typing i { width: 6px; height: 6px; border-radius: 50%; background: #bbb; animation: bl 1s infinite; } .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; } @keyframes bl { 50% { opacity: .3; } }
.act { flex: none; padding: 6px 16px 2px; } .act .btn { height: 48px; }
.qc { flex: none; display: flex; gap: 8px; overflow-x: auto; padding: 8px 16px 0; scrollbar-width: none; } .qc button { flex: none; height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid #e3e3e3; font-size: 13px; background: #fff; }
.qc button.y { background: var(--yellow); border-color: var(--yellow); font-weight: 500; }
.inp { flex: none; display: flex; gap: 8px; align-items: center; padding: 8px 16px 34px; } .inp input { flex: 1; height: 44px; border-radius: 22px; border: 0; background: var(--field); padding: 0 16px; font-size: 14px; outline: 0; } .inp button { width: 44px; height: 44px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; } .inp button svg { width: 20px; height: 20px; }</style></head>
<body><div class="screen " aria-label="Chat">
<div data-render="status"></div><header data-render="bar:Erin Mango|★ 4.9 · 32 ratings:back:messages::"></header><a class="strip" id="strip"></a><div class="msgs" id="msgs"></div>
<div class="act" id="act" hidden></div><div class="qc" id="qc"></div><div class="inp"><input id="m" placeholder="Message" aria-label="Message" autocomplete="off"><button id="send" aria-label="Send"><i data-icon="send"></i></button></div>
</div><script src="data.js"></script><script src="nu.js"></script><script>var it=NU.item(decodeURIComponent(location.hash.slice(1))||NU.get("item"));NU.set("item",it.id);var C=NU.chat(it.id),P=it.price,busy=false;
document.querySelector(".bar h1").innerHTML="";document.querySelector(".bar h1").appendChild(document.createTextNode(it.seller));document.querySelector(".bar h1").insertAdjacentHTML("beforeend","<small>"+NU.trust(it.score,it.ratings)+(it.verified?" · verified":"")+"</small>");
var PILL=['<span class="pill">'+(it.sold&&C.stage<3?"Sold":"Available")+'</span>','<span class="pill y">Agreed</span>','<span class="pill g">Confirmed / hold</span>','<span class="pill k">Sold</span>','<span class="pill k">Sold</span>'];
function usd(n){return "$"+(+n).toLocaleString("en-US");}
function strip(){var s=document.getElementById("strip");s.setAttribute("data-go","product#"+it.id);s.innerHTML=NU.pic(it,"thumb")+'<span class="sp"><b>'+(C.price!=null&&C.stage?usd(C.price):NU.money(it))+'</b><p></p></span>'+PILL[C.stage];s.querySelector("p").textContent=it.title;}
function esc(t){var d=document.createElement("i");d.textContent=t;return d.innerHTML;}
function draw(){var h=C.msgs.map(function(m){if(m[0]==="sys")return '<div class="sys">'+NU.icon("shield")+esc(m[1])+'</div>';return '<div class="mb '+m[0]+(m[2]==="offer"?" offer":"")+'">'+esc(m[1])+(m[2]==="offer"?"<small>offer</small>":"")+'</div>';}).join("");
 if(busy)h+='<div class="typing"><i></i><i></i><i></i></div>';var M=document.getElementById("msgs");M.innerHTML=h;M.scrollTop=1e5;strip();controls();}
function save(){NU.chat(it.id,C);}
function add(who,t,kind){C.msgs.push(kind?[who,t,kind]:[who,t]);save();draw();}
function reply(t,then){busy=true;draw();setTimeout(function(){busy=false;add("them",t);if(then)then();},1000);}
var dep=function(){return C.dep||0;};
function controls(){var q=[],a="";
 if(C.stage===0){if(P>0){q.push(['Take it at '+usd(P),"take",1]);q.push(["Make an offer","offer"]);}else q.push(["Can I have it?","take",1]);q.push(["Is this still available?","txt"]);q.push(["Can I pick it up today?","txt"]);}
 else if(C.stage===1)a='<button class="btn" data-overlay="deal">Confirm deal · '+usd(C.price)+'</button>';
 else if(C.stage===2){a='<button class="btn" data-go="meetup#'+it.id+'">Meet up &amp; verify codes</button>';q.push(["See you there!","txt"]);q.push(["Running 5 min late","txt"]);}
 else if(C.stage===3)a='<button class="btn" data-go="feedback#'+it.id+'">Rate '+it.first+'</button>';
 else q.push(["Thanks again!","txt"]);
 if(it.sold&&C.stage===0){q=[];a='<button class="btn gray" disabled>This item is sold</button>';}
 var A=document.getElementById("act");A.hidden=!a;A.innerHTML=a;
 var Q=document.getElementById("qc");Q.scrollLeft=0;Q.innerHTML=q.map(function(x){return x[1]==="offer"?'<button data-overlay="offer">'+x[0]+'</button>':'<button data-k="'+x[1]+'"'+(x[2]?' class="y"':'')+'>'+x[0]+'</button>';}).join("");}
function agree(p){C.stage=1;C.price=p;save();}
function send(t){t=t.trim();if(!t||busy)return;var first=!C.msgs.some(function(m){return m[0]==="me";});add("me",t);
 if(C.stage===0&&first)reply(P?"Hi! Yes, it’s still available 🙂 You can take it at "+usd(P)+" or make an offer.":"Hi! It’s yours if you can pick it up at "+it.place+".");
 else if(C.stage===2)reply("👍 I’ll be there. Tap Meet up when you see me and we’ll swap codes.");
 else if(C.stage>=3)reply("Anytime! Good luck with the quarter 🙌");
 else reply("Sounds good!");}
document.getElementById("qc").addEventListener("click",function(e){var b=e.target.closest("[data-k]");if(!b||busy)return;
 if(b.dataset.k==="take"){var p=C.counter||P;add("me",P?(C.counter?"Deal at "+usd(p)+"!":"I’ll take it at "+usd(p)+"."):"Can I have it? I can pick up today.");agree(p);reply(P?"Deal! 🙌 Tap Confirm deal and we’ll set up the meet-up.":"Yes! Confirm and I’ll hold it for you.",draw);}
 else send(b.textContent);});
document.getElementById("send").addEventListener("click",function(){var m=document.getElementById("m");send(m.value);m.value="";});
document.getElementById("m").addEventListener("keydown",function(e){if(e.key==="Enter"){send(this.value);this.value="";}});
/* Offers and deals come back from the overlays through sessionStorage */
function pending(){var o=NU.get("offer");if(o){NU.set("offer","");o=+o;add("me","Offer: "+usd(o),"offer");
  if(o>=Math.round(P*.85)){agree(o);reply("Deal, "+usd(o)+" works for me 👍",draw);}else{var y=Math.ceil(P*.9);C.counter=y;save();reply("Could you do "+usd(y)+"? It’s barely used.",function(){var q=document.querySelector('#qc [data-k="take"]');if(q)q.textContent="Accept "+usd(y);});}}
 var d=NU.get("deal");if(d){NU.set("deal","");d=JSON.parse(d);C.stage=2;C.pay=d.pay;C.dep=d.dep;save();
  add("sys","Deal confirmed · "+usd(C.price)+" · "+d.pay+(d.dep?" · "+usd(d.dep)+" deposit on hold":""));add("sys","Order marked confirmed / hold");reply("Awesome! Meet at "+it.place+" today at 4:00 pm?");}}
pending();NU.onStore(function(k){if(k==="offer"||k==="deal")pending();});
if(C.stage===0&&C.counter){draw();var q=document.querySelector('#qc [data-k="take"]');if(q)q.textContent="Accept "+usd(C.counter);}else draw();</script><script src="proto.js"></script>
</body></html>
