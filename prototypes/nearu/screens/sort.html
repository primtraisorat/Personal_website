<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>nearU · Sort</title>
<link rel="stylesheet" href="nu.css">
<style>.so { margin: 12px 0 18px; } .so .li { width: 100%; text-align: left; font-size: 14px; }</style></head>
<body><div class="screen ov" aria-label="Sort">
<div class="sheet"><div class="grab"></div><h1 class="big">sort by</h1><div class="so" data-tabs id="so"><button class="li" data-tab data-v="0" aria-selected="true"><span class="sp">Popular first</span><span class="radio"><i data-icon="check"></i></span></button><button class="li" data-tab data-v="1" aria-selected="false"><span class="sp">New first</span><span class="radio"><i data-icon="check"></i></span></button><button class="li" data-tab data-v="2" aria-selected="false"><span class="sp">Price: low to high</span><span class="radio"><i data-icon="check"></i></span></button><button class="li" data-tab data-v="3" aria-selected="false"><span class="sp">Price: high to low</span><span class="radio"><i data-icon="check"></i></span></button></div><button class="btn gray" data-close>Cancel</button></div>
</div><script src="data.js"></script><script src="nu.js"></script><script>var v=NU.get("sort")||"0";document.querySelectorAll("#so .li").forEach(function(b){b.setAttribute("aria-selected",b.dataset.v===v?"true":"false");});document.getElementById("so").addEventListener("tab",function(e){NU.set("sort",e.detail.dataset.v);setTimeout(NU.close,250);});</script><script src="proto.js"></script>
</body></html>
