<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>TappedIn · Landing</title>
<link rel="stylesheet" href="tappedin.css">
<style>
.screen { width: 1440px; height: 1024px; }
.search { left: 311px; top: 475px; width: 862px; height: 55px; border-radius: 100px; background: #fff; box-shadow: 0 0 15px -9px rgba(46,36,7,.5);
  display: flex; align-items: center; justify-content: space-between; padding: 10px 15px 10px 10px; }
.search .q { flex: 1; display: flex; align-items: center; gap: 10px; color: #9596a0; font-weight: 500; font-size: 16px; }
.search .q img { width: 34px; height: 34px; }
.search input { flex: 1; border: 0; outline: 0; background: none; font-weight: 500; font-size: 16px; color: #000; }
.search input::placeholder { color: #9596a0; }
.now { display: flex; align-items: center; gap: 8px; padding: 10px 15px; border-radius: 43px; background: #f3f4f8; font-size: 14px; }
.dot { width: 15px; height: 15px; border-radius: 50%; background: #ea7780; display: grid; place-items: center; }
.dot::after { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #f24654; }

.blob { left: 0; top: 286px; width: 1440px; height: 738px; pointer-events: none; }
.hero { left: 0; right: 0; top: 339px; text-align: center; }
.hero h1 { font-weight: 700; font-size: 40px; line-height: 1.25; }
.hero p { margin-top: 15px; color: #9596a0; font-weight: 500; font-size: 20px; }
.chips { left: 0; right: 0; top: 573px; display: grid; justify-items: center; gap: 20px; }
.chips div { display: flex; gap: 10px; }
/* Picked moods sit in the search bar, 10px apart like the rows below */
.search .q { min-width: 0; }
.picked { display: flex; gap: 10px; flex: none; max-width: 560px; overflow-x: auto; scrollbar-width: none; }
.picked:empty { display: none; }
.picked .ti-chip { height: 34px; background: #f4d6d9; box-shadow: none; gap: 8px; padding: 0 12px 0 20px; }
.picked .ti-chip::after { content: "\00d7"; font-size: 18px; line-height: 1; color: #ea7780; }
.picked .ti-chip:hover { background: #efc4c8; }
.search input { min-width: 120px; }
</style></head>
<body><div class="screen ti-bg" aria-label="TappedIn landing page: an AI search bar with mood prompts">
<img class="abs blob" src="assets/ti-blob.webp" alt="">
<header class="ti-nav"><a class="ti-brand" href="#" data-go="landing" style="color:inherit;text-decoration:none"><img src="assets/ti-logo.webp" alt="">TappedIn</a><div class="ti-nav-right"><a class="ti-pill-black" href="#" data-go="all-listing" style="text-decoration:none">For You</a><a href="#" data-overlay="login" aria-label="Your profile"><img class="ti-avatar" src="assets/ti-avatar.webp" alt=""></a></div></header>
<div class="abs hero"><h1>Search for events based your vibe</h1><p>Type your vibe to discover events tailored just for you.</p></div>
<form class="abs search" data-search="split-screen"><div class="q"><button type="button" data-overlay="filters" aria-label="Filters"><img src="assets/ti-filter.webp" alt=""></button><input type="search" aria-label="Describe your vibe" placeholder="I want something relaxing for next weekend..."></div><button type="submit" class="now" data-go="split-screen"><span class="dot"></span>Happening Now</button></form>
<div class="abs chips"><div><button class="ti-chip mood" aria-pressed="false">Happening Now</button><button class="ti-chip mood" aria-pressed="false">Chill</button><button class="ti-chip mood" aria-pressed="false">Hype</button><button class="ti-chip mood" aria-pressed="false">Adventurous</button><button class="ti-chip mood" aria-pressed="false">Nightlife</button><button class="ti-chip mood" aria-pressed="false">Comedy</button></div><div><button class="ti-chip mood" aria-pressed="false">With Friends</button><button class="ti-chip mood" aria-pressed="false">Creative</button><button class="ti-chip mood" aria-pressed="false">Foodie</button><button class="ti-chip mood" aria-pressed="false">Cozy</button><button class="ti-chip mood" aria-pressed="false">Date Night</button><button class="ti-chip mood" aria-pressed="false">Music</button></div></div>
<script>
/* Mood pills: clicking one adds it to the search bar (click again, or its x, to take it out). Searching carries the moods to the results. */
(function () {
  var form = document.querySelector('form.search'), input = form.querySelector('input'), q = form.querySelector('.q');
  var picked = document.createElement('div'); picked.className = 'picked'; q.insertBefore(picked, input);
  function sync() {
    var on = [].filter.call(document.querySelectorAll('.mood'), function (b) { return b.getAttribute('aria-pressed') === 'true'; });
    picked.innerHTML = on.map(function (b) { return '<button type="button" class="ti-chip" data-mood="' + b.textContent + '" aria-label="Remove ' + b.textContent + '">' + b.textContent + '</button>'; }).join('');
    input.placeholder = on.length ? 'Add more about your vibe...' : 'I want something relaxing for next weekend...';
  }
  document.addEventListener('click', function (e) {
    var m = e.target.closest('.mood'), x = e.target.closest('[data-mood]'), go = e.target.closest('form.search [data-go]');
    if (m) { m.setAttribute('aria-pressed', m.getAttribute('aria-pressed') === 'true' ? 'false' : 'true'); sync(); input.focus(); }
    if (x) { [].forEach.call(document.querySelectorAll('.mood'), function (b) { if (b.textContent === x.getAttribute('data-mood')) b.setAttribute('aria-pressed', 'false'); }); sync(); }
    if (go) {
      var words = [].map.call(picked.children, function (b) { return b.textContent.toLowerCase(); });
      var text = input.value.trim() || (words.length ? 'I want something ' + words.join(', ') : '');
      go.setAttribute('data-go', 'split-screen' + (text ? '#' + encodeURIComponent(text) : ''));
    }
  }, true);
})();
</script>
</div><script src="events.js"></script><script src="proto.js"></script>
</body></html>
