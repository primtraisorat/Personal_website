<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>TappedIn · For You</title>
<link rel="stylesheet" href="tappedin.css">
<style>
.screen { width: 1441px; height: 2012px; }
.blob { left: -33px; top: 760px; width: 1494px; height: 1027px; opacity: .9; pointer-events: none; }
/* In the player the page scrolls under a fixed backdrop: the gradient and orange glow sit where they do on the search page. */
body:not(.solo) .screen { background-attachment: fixed; }
body:not(.solo) .blob { position: fixed; left: 0; top: auto; bottom: 0; width: 1440px; height: 738px; opacity: 1; }
.row { position: absolute; left: 65px; width: 1313px; }
.rh { display: flex; justify-content: space-between; align-items: center; height: 30px; margin-bottom: 30px; }
.rh h2 { font-weight: 700; font-size: 30px; color: #030303; }
.arrows { display: flex; gap: 5px; }
.arrows button { width: 25px; height: 25px; border-radius: 50%; background: #e3e3e3; color: #555; font-size: 18px; line-height: 23px; text-align: center; }
.arrows button:hover { background: #d4d4d4; }
.cards { display: flex; gap: 32px; }
.line { left: 65px; width: 1313px; height: 1px; background: #e0ccab; }
</style></head>
<body><div class="screen ti-bg" aria-label="TappedIn For You: rows of events happening now, recommended, recently posted and popular in Los Angeles">
<img class="abs blob" src="assets/ti-blob.webp" alt="">
<section class="row" style="top:164px"><div class="rh"><h2>Happening Now</h2><span class="arrows"><button aria-label="Previous">‹</button><button aria-label="Next">›</button></span></div><div class="cards" data-cards="0,7,2,15"></div></section>
<section class="row" style="top:581px"><div class="rh"><h2>Recommended for you</h2><span class="arrows"><button aria-label="Previous">‹</button><button aria-label="Next">›</button></span></div><div class="cards" data-cards="9,11,4,1"></div></section>
<div class="abs line" style="top:998px"></div>
<section class="row" style="top:1048px"><div class="rh"><h2>Recently Posted Events</h2><span class="arrows"><button aria-label="Previous">‹</button><button aria-label="Next">›</button></span></div><div class="cards" data-cards="3,6,13,14" data-plain></div></section>
<div class="abs line" style="top:1465px"></div>
<section class="row" style="top:1515px"><div class="rh"><h2>Popular Events In Los Angeles</h2><span class="arrows"><button aria-label="Previous">‹</button><button aria-label="Next">›</button></span></div><div class="cards" data-cards="5,8,10,12" data-plain></div></section>

</div><script src="events.js"></script><script src="proto.js"></script>
