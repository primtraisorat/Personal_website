<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>TappedIn · Log in or sign up</title>
<link rel="stylesheet" href="tappedin.css">
<style>
.screen { width: 725px; height: 710px; }
.screen { background: none; }
</style></head>
<body><div class="screen " aria-label="TappedIn pop-up: create an account or sign in">
<div class="pop">
<div class="pop-form">
  <div style="display:grid;justify-items:center"><img src="assets/ti-logo.webp" alt="" width="71" height="60"><p class="pop-title">Tappedin</p></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:40px;width:609px;padding:11px 82px">
    <button class="btn-black" data-overlay="create-account" style="width:340px;height:83px;font:400 24px Inter,sans-serif">Create Account</button>
    <div class="or">OR</div>
    <div style="display:grid;justify-items:center;gap:20px"><p style="font:400 24px Inter,sans-serif">Already have an account?</p>
    <button class="btn-black" data-overlay="sign-in" style="width:340px;height:83px;font:400 24px Inter,sans-serif">Sign In</button></div>
  </div>
</div></div>
</div><script src="proto.js"></script>
</body></html>
