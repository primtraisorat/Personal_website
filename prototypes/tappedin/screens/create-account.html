<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>TappedIn · Create account</title>
<link rel="stylesheet" href="tappedin.css">
<style>
.screen { width: 725px; height: 710px; }
.screen { background: none; }
</style></head>
<body><div class="screen " aria-label="TappedIn pop-up: create an account with email or Google">
<div class="pop">
<form class="pop-form" data-overlay-submit="information">
  <p class="pop-title">Create Account</p>
  <div class="fields"><label class="field"><span>Email Address</span><input type="email" placeholder="Enter your email..."></label><label class="field"><span>Password</span><input type="password" placeholder="Enter your password..."></label><label class="field"><span>Password Confirmation</span><input type="password" placeholder="Enter your password again"></label>
    <button class="btn-black" data-overlay="information" style="padding:12px;font-weight:500;font-size:16px;border-radius:20px">Create Account</button></div>
  <div class="or">OR</div>
  <button class="btn-black" data-overlay="information" style="width:434px;height:58px;font:400 24px Inter,sans-serif"><span class="g"></span>Create with Google</button>
</form></div>
</div><script src="events.js"></script><script src="proto.js"></script>
<script>document.querySelector("form").addEventListener("submit", function (e) { e.preventDefault(); this.querySelector(".btn-black").click(); });</script>
</body></html>
