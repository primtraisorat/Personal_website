<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>TappedIn · Profile · Friend requests</title>
<link rel="stylesheet" href="tappedin.css">
<style>
.screen { width: 1441px; height: 1514px; }
.screen { background: linear-gradient(166.76deg, #fff 9.15%, #fff4eb 88.61%), #fff; }
.ti-nav { left: 1px; }
.pf-add[aria-pressed="true"] { background: #ea7780; }

.people { left: 413px; top: 637px; display: grid; gap: 30px; }
.acts { display: flex; gap: 10px; justify-content: flex-end; width: 178px; }
.done { color: #9596a0; font: 400 16px/40px "Inter", sans-serif; }
</style></head>
<body><div class="screen " aria-label="TappedIn profile: friend requests to accept or ignore">
<header class="ti-nav" style="left:1px"><a class="ti-brand" href="#" data-go="landing" style="color:inherit;text-decoration:none"><img src="assets/ti-logo.webp" alt="">TappedIn</a><div class="ti-nav-right"><a class="ti-pill-black" href="#" data-go="split-screen" style="text-decoration:none">Chat</a><a href="#" data-go="favorited" aria-label="Your profile"><img class="ti-avatar" src="assets/ti-avatar.webp" alt=""></a></div></header>
<div class="abs pf-hero"></div>
<div class="abs pf-who"><img src="assets/ti-avatar-lg.webp" alt="" width="189" height="185"><div><h1>Username</h1>
  <div class="pf-stats"><span>Friends</span><span>Upcoming</span><span>xx favorites</span><span>xx attended</span></div>
  <button class="pf-add" data-toggle aria-pressed="false"><img src="assets/ti-friends.webp" alt="" width="22" height="22">Add Friend</button></div></div>
<nav class="abs pf-tabs" aria-label="Profile sections"><button data-go="favorited">Favorited Events</button><button data-go="calendar">Calendar</button><button class="on" aria-current="page">Friends</button><button data-go="settings">Settings</button></nav>
<div class="abs pf-rule"></div>
<div class="abs pf-vrule"></div>
<div class="abs pf-side"><button data-go=friends><b>Friends</b><span>20 Connections</span></button><button class=on><b>Friend Request</b><span>1 Request</span></button></div>
<div class="abs people"><div class="pf-person req"><span><i></i>Username</span><span class="acts"><button class="pf-btn ghost" data-dismiss>Ignore</button><button class="pf-btn" data-accept>Accept</button></span></div><div class="pf-person req"><span><i></i>Username</span><span class="acts"><button class="pf-btn ghost" data-dismiss>Ignore</button><button class="pf-btn" data-accept>Accept</button></span></div></div>
<script>
document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-accept],[data-dismiss]'); if (!b) return;
  var row = b.closest('.req');
  row.querySelector('.acts').innerHTML = b.hasAttribute('data-accept') ? '<span class="done">Friends</span>' : '<span class="done">Ignored</span>';
}, true);
</script>
</div><script src="proto.js"></script>
</body></html>
