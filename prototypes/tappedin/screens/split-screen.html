<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>TappedIn · Search results</title>
<link rel="stylesheet" href="tappedin.css">
<style>
.screen { width: 1440px; height: 1024px; }
.chat { left: 65px; top: 151px; width: 640px; height: 97px; }
.bubble { position: absolute; padding: 7px 20px; background: #fce6bd; font-weight: 500; font-size: 16px; white-space: nowrap; }
.b1 { right: 0; top: 0; border-radius: 50px 0 30px 50px; }
.b2 { left: 0; top: 62px; border-radius: 0 50px 50px 30px; }
.fade { left: 64px; top: 908px; width: 640px; height: 116px; background: linear-gradient(177.7deg, #fff 9.15%, #fff4eb 88.61%); }
.sbar { left: 64px; top: 908px; width: 640px; height: 54px; border-radius: 30px; background: #fff; filter: drop-shadow(1px 1px 2.5px rgba(46,36,7,.11));
  display: flex; align-items: center; justify-content: space-between; padding: 10px 15px 10px 10px; }
.sbar .q { flex: 1; display: flex; align-items: center; gap: 10px; }
.sbar .q img { width: 34px; height: 34px; }
.sbar input { flex: 1; border: 0; outline: 0; background: none; font: 400 16px "Inter", sans-serif; }
.sbar input::placeholder { color: #747474; }
.map { left: 736px; top: 151px; width: 640px; height: 811px; border-radius: 20px; overflow: hidden; box-shadow: 0 4px 5px rgba(0,0,0,.25); }

.list { left: 65px; top: 280px; width: 660px; height: 628px; overflow-y: auto; scrollbar-width: none; padding: 4px 20px 140px 4px; margin: -4px 0 0 -4px; }
.grid { display: grid; grid-template-columns: 304px 304px; gap: 32px; }
.zoom { position: absolute; right: 20px; top: 20px; width: 40px; border-radius: 8px; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.25); display: grid; z-index: 3; }
.zoom button { height: 40px; font-size: 26px; line-height: 1; color: #333; }
.zoom button + button { border-top: 1px solid #e5e5e5; }
/* Map Cards component: closed = red pin, hover = pink pin, open = black pin with the event card above */
.mc { position: absolute; width: 304px; height: 367px; pointer-events: none; }
.mc-card { position: absolute; left: 0; top: 0; display: none; pointer-events: auto; }
.mc.open { z-index: 2; }
.mc.open .mc-card { display: block; }
.mc-pin { position: absolute; left: 123px; top: 319px; width: 48px; height: 48px; pointer-events: auto; }
.mc-pin svg { width: 48px; height: 48px; fill: #ff5656; transition: fill .15s, transform .15s; transform-origin: 50% 100%; }
.mc-pin:hover svg { fill: #ea7780; transform: scale(1.08); }
.mc.open .mc-pin svg { fill: #000; }
</style></head>
<body><div class="screen ti-bg-plain" aria-label="TappedIn results: event cards beside a map of where each event is">
<header class="ti-nav"><a class="ti-brand" href="#" data-go="landing" style="color:inherit;text-decoration:none"><img src="assets/ti-logo.webp" alt="">TappedIn</a><div class="ti-nav-right"><a class="ti-pill-black" href="#" data-go="all-listing" style="text-decoration:none">For You</a><a href="#" data-go="favorited" aria-label="Your profile"><img class="ti-avatar" src="assets/ti-avatar.webp" alt=""></a></div></header>
<div class="abs chat"><span class="bubble b1" id="ask">I want something chill and fun</span><span class="bubble b2">here is what you are looking for:</span></div>
<div class="abs list"><div class="grid" data-cards="0,7,3,9,12,4"></div></div>
<div class="abs fade"></div>
<form class="abs sbar" data-search="no-results" style="left:64px;top:908px"><div class="q"><button type="button" data-overlay="filters" aria-label="Filters"><img src="assets/ti-filter.webp" alt=""></button><input type="search" aria-label="Describe your vibe" placeholder="I want something relaxing for next weekend..."></div><button type="submit" data-go="no-results" aria-label="Search"><img src="assets/ti-search.webp" alt="" width="24" height="24"></button></form>
<div class="abs map"><img src="assets/ti-map-clean.webp" alt="Map of west Los Angeles" width="640" height="811">
  <div class="zoom"><button aria-label="Zoom in">+</button><button aria-label="Zoom out">−</button></div>
  <div class="mc open" style="left:258px;top:23px" data-event="0"><div class="mc-card" data-cards="0" style="left:0px"></div><button class="mc-pin" aria-label="Show event on map"><svg viewBox="0 0 24 24"><path d="M12 2C7.6 2 4 5.5 4 9.9 4 15.5 12 22 12 22s8-6.5 8-12.1C20 5.5 16.4 2 12 2z"/><circle cx="12" cy="10" r="3" fill="#fff"/></svg></button></div><div class="mc" style="left:-14px;top:42px" data-event="7"><div class="mc-card" data-cards="7" style="left:26px"></div><button class="mc-pin" aria-label="Show event on map"><svg viewBox="0 0 24 24"><path d="M12 2C7.6 2 4 5.5 4 9.9 4 15.5 12 22 12 22s8-6.5 8-12.1C20 5.5 16.4 2 12 2z"/><circle cx="12" cy="10" r="3" fill="#fff"/></svg></button></div><div class="mc" style="left:366px;top:206px" data-event="3"><div class="mc-card" data-cards="3" style="left:-42px"></div><button class="mc-pin" aria-label="Show event on map"><svg viewBox="0 0 24 24"><path d="M12 2C7.6 2 4 5.5 4 9.9 4 15.5 12 22 12 22s8-6.5 8-12.1C20 5.5 16.4 2 12 2z"/><circle cx="12" cy="10" r="3" fill="#fff"/></svg></button></div><div class="mc" style="left:207px;top:168px" data-event="9"><div class="mc-card" data-cards="9" style="left:0px"></div><button class="mc-pin" aria-label="Show event on map"><svg viewBox="0 0 24 24"><path d="M12 2C7.6 2 4 5.5 4 9.9 4 15.5 12 22 12 22s8-6.5 8-12.1C20 5.5 16.4 2 12 2z"/><circle cx="12" cy="10" r="3" fill="#fff"/></svg></button></div><div class="mc" style="left:172px;top:390px" data-event="12"><div class="mc-card" data-cards="12" style="left:0px"></div><button class="mc-pin" aria-label="Show event on map"><svg viewBox="0 0 24 24"><path d="M12 2C7.6 2 4 5.5 4 9.9 4 15.5 12 22 12 22s8-6.5 8-12.1C20 5.5 16.4 2 12 2z"/><circle cx="12" cy="10" r="3" fill="#fff"/></svg></button></div></div>
<script>
var q = decodeURIComponent(location.hash.slice(1)); if (q) document.getElementById('ask').textContent = q;
document.addEventListener('click', function (e) {
  var p = e.target.closest('.mc-pin'); if (!p) return;
  e.stopPropagation();
  var mc = p.closest('.mc'), was = mc.classList.contains('open');
  document.querySelectorAll('.mc.open').forEach(function (m) { m.classList.remove('open'); });
  if (!was) mc.classList.add('open');
}, true);
</script>
</div><script src="events.js"></script><script src="proto.js"></script>
</body></html>
