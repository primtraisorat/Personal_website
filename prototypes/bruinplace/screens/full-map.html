<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>BruinPlace · Full map</title>
<link rel="stylesheet" href="bp.css">
<style>
.mapwrap { position: relative; margin: 50px 0 61px 129px; width: 1193px; height: 658px; }

.tiles { left: -333px; top: 0; width: 2006px; height: 719px; }
</style></head>
<body><div class="screen" aria-label="Full-screen map of listings around UCLA">
<header data-render="header:search"></header>

      <button class="pin" style="left:1065px;top:520px">$1,899</button><button class="pin" style="left:720px;top:500px">$1,423</button>
    </div>
    <div class="bp-ctrl"><a class="max" href="#" data-go="building-split" aria-label="Back to the list"><img src="assets/icons/minimize-2.svg" alt=""></a>
      <div class="zoom"><button type="button" data-zoom="in" aria-label="Zoom in">+</button><button type="button" data-zoom="out" aria-label="Zoom out">&minus;</button></div></div>
  </div>
  <div class="pin-card" hidden></div>
</main>
<footer data-render="footer"></footer>
</div><script src="bp.js"></script><script src="proto.js"></script>
</body></html>
