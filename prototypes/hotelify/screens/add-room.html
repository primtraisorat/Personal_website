<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Hotelify · Add room</title>
<link rel="stylesheet" href="hf.css">
<style>
.screen { width: 752px; height: 618px; }
.field.wide textarea { width: 704px; }
</style></head>
<body><div class="screen modal" aria-label="Add room">
<div class="form"><div class="field"><label>Room number</label><input placeholder="Enter room number"></div><div class="field"><label>Bed type</label><input placeholder="Enter bed type"></div><div class="field"><label>Room floor</label><input placeholder="Enter room floor"></div><div class="field"><label>Status</label><input placeholder="Available, booked, reserved…"></div><div class="field wide"><label>Room facility</label><textarea placeholder="AC, shower, towel, bathtub, TV…"></textarea></div><div class="field"><label>Room type</label><input placeholder="Single, double, triple or VIP"></div><div class="field"><label>Capacity</label><input placeholder="Enter number of guests"></div><div class="field"><label>Price</label><input placeholder="Enter price per night"></div><div class="field"><label>Rooms</label><input placeholder="Enter number of rooms"></div></div><div class="actions"><button class="btn ghost" data-close>Cancel</button><button class="btn" data-close>Save</button></div>
</div><script src="hf.js"></script><script src="proto.js"></script>
</body></html>
