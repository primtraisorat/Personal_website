<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>TappedIn · Landing</title>
<link rel="stylesheet" href="screens.css"><link rel="stylesheet" href="tappedin.css">
<style>
.screen { width: 1440px; height: 1024px; }
.blob { left: 0; top: 286px; width: 1440px; height: 738px; }
.hero { left: 0; right: 0; top: 339px; text-align: center; }
.hero h1 { margin: 0; font-weight: 700; font-size: 40px; line-height: 1.25; }
.hero p { margin-top: 15px; color: #9596a0; font-weight: 500; font-size: 20px; }
.search { left: 311px; top: 475px; width: 862px; height: 55px; border-radius: 100px; background: #fff; box-shadow: 0 0 15px -9px rgba(46,36,7,.5);
  display: flex; align-items: center; justify-content: space-between; padding: 10px 15px 10px 10px; }
.search .q { display: flex; align-items: center; gap: 10px; color: #9596a0; font-weight: 500; font-size: 16px; }
.search .q img { width: 34px; height: 34px; }
.now { display: flex; align-items: center; gap: 8px; padding: 10px 15px; border-radius: 43px; background: #f3f4f8; font-size: 14px; }
.dot { width: 15px; height: 15px; border-radius: 50%; background: #ea7780; display: grid; place-items: center; }
.dot::after { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #f24654; }
.chips { left: 0; right: 0; top: 573px; display: grid; justify-items: center; gap: 20px; }
.chips div { display: flex; gap: 10px; }
</style></head>
<body><div class="screen ti-bg" role="img" aria-label="TappedIn landing page: an AI search bar with mood prompts">
  <img class="abs blob" src="assets/ti-blob.webp" alt="">
  <header class="ti-nav"><div class="ti-brand"><img src="assets/ti-logo.webp" alt="">TappedIn</div>
    <div class="ti-nav-right"><span class="ti-pill-black">For You</span><img class="ti-avatar" src="assets/ti-avatar.webp" alt=""></div></header>
  <div class="abs hero"><h1>Search for events based your vibe</h1><p>Type your vibe to discover events tailored just for you.</p></div>
  <div class="abs search"><div class="q"><img src="assets/ti-filter.webp" alt="">I want something relaxing for next weekend...</div>
    <div class="now"><span class="dot"></span>Happening Now</div></div>
  <div class="abs chips">
    <div><span class="ti-chip">Happening Now</span><span class="ti-chip">Chill</span><span class="ti-chip">Hype</span><span class="ti-chip">Adventurous</span><span class="ti-chip">Nightlife</span><span class="ti-chip">Comedy</span></div>
    <div><span class="ti-chip">With Friends</span><span class="ti-chip">Creative</span><span class="ti-chip">Foodie</span><span class="ti-chip">Cozy</span><span class="ti-chip">Date Night</span><span class="ti-chip">Music</span></div>
  </div>
</div><script src="hot.js"></script>
</body></html>
